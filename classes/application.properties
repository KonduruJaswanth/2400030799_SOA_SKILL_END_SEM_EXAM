spring.application.name=tourist-jwt-spring
server.port=8080

spring.datasource.url=jdbc:h2:mem:touristdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Demo key for local learning only. Replace with a secure secret from environment variables in production.
app.jwt.secret=TouristDemoSecretKeyForLocalTestingOnly-ChangeMe123456
app.jwt.expiration-ms=3600000
